spring:
  application:
    name: unihelp-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unihelp}
    username: ${DB_USERNAME:unihelp}
    password: ${DB_PASSWORD:unihelp}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
