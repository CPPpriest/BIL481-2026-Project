services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: unihelp
      POSTGRES_USER: unihelp
      POSTGRES_PASSWORD: unihelp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unihelp -d unihelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/unihelp
      DB_USERNAME: unihelp
      DB_PASSWORD: unihelp
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
