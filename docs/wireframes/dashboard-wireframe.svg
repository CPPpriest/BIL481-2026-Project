<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Campus at a Glance dashboard low-fidelity wireframe</title>
  <desc id="description">A planned desktop dashboard containing cafeteria, shuttle, library occupancy, and connector health cards.</desc>
  <style>
    .bg { fill: #f4f6f9; }
    .surface { fill: #ffffff; stroke: #aab3c2; stroke-width: 2; }
    .header { fill: #17233d; }
    .primary { fill: #2855d9; }
    .soft { fill: #e9eefc; stroke: #9aabe0; stroke-width: 1.5; }
    .warning { fill: #fff3d6; stroke: #d89b24; stroke-width: 1.5; }
    .success { fill: #e2f6e9; stroke: #50a46d; stroke-width: 1.5; }
    .muted { fill: #e9edf3; }
    .title { font: 700 24px Arial, sans-serif; fill: #17233d; }
    .card-title { font: 700 20px Arial, sans-serif; fill: #17233d; }
    .body { font: 16px Arial, sans-serif; fill: #33415c; }
    .small { font: 14px Arial, sans-serif; fill: #59677f; }
    .tiny { font: 12px Arial, sans-serif; fill: #59677f; }
    .white { fill: #ffffff; }
    .label { font: 700 13px Arial, sans-serif; letter-spacing: 0.8px; }
    .line { stroke: #bac2cf; stroke-width: 2; }
    .dash { stroke: #8d98aa; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
  </style>

  <rect class="bg" width="1440" height="900"/>
  <rect class="header" width="1440" height="82"/>
  <text x="72" y="35" class="white" style="font:700 22px Arial,sans-serif">Campus Data Orchestrator</text>
  <text x="72" y="60" class="white" style="font:14px Arial,sans-serif">Campus at a Glance</text>

  <rect x="520" y="21" width="130" height="40" rx="20" fill="#2f4169"/>
  <text x="550" y="47" class="white body">Dashboard</text>
  <text x="692" y="47" class="white body">Assistant</text>
  <rect x="1165" y="20" width="202" height="42" rx="21" fill="#2f4169"/>
  <circle cx="1192" cy="41" r="12" fill="#92a5cc"/>
  <text x="1216" y="46" class="white small">Guest / Sign in</text>

  <rect x="72" y="108" width="1296" height="48" rx="8" class="soft"/>
  <text x="92" y="137" class="label" fill="#2855d9">LOW-FIDELITY WIREFRAME — PLANNED UI, NOT AN IMPLEMENTED SCREENSHOT</text>

  <!-- Cafeteria card -->
  <rect x="72" y="184" width="620" height="258" rx="14" class="surface"/>
  <text x="98" y="218" class="card-title">Today's Cafeteria Menu</text>
  <rect x="515" y="197" width="146" height="28" rx="14" class="warning"/>
  <text x="537" y="216" class="tiny">SIMULATED DATA</text>
  <rect x="98" y="244" width="115" height="34" rx="7" class="primary"/>
  <text x="130" y="266" class="white small">Lunch</text>
  <rect x="219" y="244" width="115" height="34" rx="7" class="muted"/>
  <text x="250" y="266" class="small">Dinner</text>
  <line x1="98" y1="300" x2="658" y2="300" class="line"/>
  <text x="102" y="330" class="body">Soup</text>
  <rect x="240" y="314" width="390" height="20" rx="5" class="muted"/>
  <text x="102" y="364" class="body">Main dish</text>
  <rect x="240" y="348" width="320" height="20" rx="5" class="muted"/>
  <text x="102" y="398" class="body">Calories / allergens</text>
  <rect x="240" y="382" width="238" height="20" rx="5" class="muted"/>
  <text x="98" y="425" class="tiny">Updated 10:15  •  Click card to prefill a menu query</text>

  <!-- Shuttle card -->
  <rect x="716" y="184" width="652" height="258" rx="14" class="surface"/>
  <text x="742" y="218" class="card-title">Campus Shuttles</text>
  <rect x="1204" y="197" width="132" height="28" rx="14" class="success"/>
  <text x="1235" y="216" class="tiny">CACHE HIT</text>
  <text x="742" y="261" class="small">Route</text>
  <text x="1002" y="261" class="small">Next departures</text>
  <line x1="742" y1="274" x2="1336" y2="274" class="line"/>
  <text x="742" y="310" class="body">Main Ring</text>
  <text x="1002" y="310" class="body">12:35  •  12:55  •  13:15</text>
  <text x="742" y="347" class="body">Metro Line</text>
  <text x="1002" y="347" class="body">12:40  •  13:10  •  13:40</text>
  <rect x="742" y="373" width="228" height="37" rx="7" class="soft"/>
  <text x="764" y="397" class="small">Walking buffer: 8 min</text>
  <text x="1002" y="397" class="tiny">Updated 10:16  •  Direct path, no LLM</text>

  <!-- Library card -->
  <rect x="72" y="468" width="620" height="286" rx="14" class="surface"/>
  <text x="98" y="502" class="card-title">Library Occupancy</text>
  <circle cx="218" cy="620" r="79" fill="none" stroke="#d9deea" stroke-width="24"/>
  <path d="M218 541 A79 79 0 1 1 143 645" fill="none" stroke="#2855d9" stroke-width="24" stroke-linecap="round"/>
  <text x="181" y="618" class="title">68%</text>
  <text x="170" y="644" class="small">occupied</text>
  <text x="340" y="558" class="small">Floor 1</text>
  <rect x="430" y="544" width="190" height="18" rx="9" class="muted"/>
  <rect x="430" y="544" width="128" height="18" rx="9" class="primary"/>
  <text x="340" y="607" class="small">Floor 2</text>
  <rect x="430" y="593" width="190" height="18" rx="9" class="muted"/>
  <rect x="430" y="593" width="92" height="18" rx="9" class="primary"/>
  <text x="340" y="656" class="small">Floor 3</text>
  <rect x="430" y="642" width="190" height="18" rx="9" class="muted"/>
  <rect x="430" y="642" width="154" height="18" rx="9" class="primary"/>
  <rect x="340" y="687" width="158" height="30" rx="15" class="warning"/>
  <text x="364" y="707" class="tiny">SIMULATED DATA</text>
  <text x="98" y="735" class="tiny">Updated 10:16  •  Capacity and per-floor availability</text>

  <!-- Connector health card -->
  <rect x="716" y="468" width="652" height="286" rx="14" class="surface"/>
  <text x="742" y="502" class="card-title">Connector Health</text>
  <text x="742" y="540" class="small">Service</text>
  <text x="1035" y="540" class="small">Status</text>
  <text x="1230" y="540" class="small">Latency</text>
  <line x1="742" y1="553" x2="1336" y2="553" class="line"/>
  <text x="742" y="590" class="body">Dining</text>
  <circle cx="1048" cy="584" r="8" fill="#50a46d"/>
  <text x="1065" y="590" class="small">Healthy</text>
  <text x="1230" y="590" class="body">18 ms</text>
  <text x="742" y="630" class="body">Shuttle</text>
  <circle cx="1048" cy="624" r="8" fill="#50a46d"/>
  <text x="1065" y="630" class="small">Healthy</text>
  <text x="1230" y="630" class="body">12 ms</text>
  <text x="742" y="670" class="body">Library</text>
  <circle cx="1048" cy="664" r="8" fill="#d89b24"/>
  <text x="1065" y="670" class="small">Stale</text>
  <text x="1230" y="670" class="body">Cached</text>
  <text x="742" y="710" class="body">SIS / Schedule</text>
  <circle cx="1048" cy="704" r="8" fill="#6f7c91"/>
  <text x="1065" y="710" class="small">Auth required</text>
  <text x="1230" y="710" class="body">—</text>
  <text x="742" y="738" class="tiny">Card D: operational state is visible without exposing secrets</text>

  <!-- Query bar -->
  <rect x="72" y="788" width="1296" height="70" rx="14" class="surface"/>
  <text x="98" y="819" class="small">Ask a campus question…</text>
  <text x="98" y="844" class="tiny">A card click prefills this field; the router decides DIRECT_WIDGET or LLM_AGENT.</text>
  <rect x="1240" y="801" width="102" height="44" rx="22" class="primary"/>
  <text x="1273" y="829" class="white body">Ask</text>

  <path d="M1372 355 L1404 355 L1404 815 L1368 815" class="dash"/>
  <text x="982" y="878" class="tiny">Desktop concept • Responsive stacking planned for 375–1920 px</text>
</svg>
